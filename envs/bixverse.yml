name: bixverse

channels:
  - conda-forge
  - bioconda
  - https://prefix.dev/almost-conductor

dependencies:
  - r-base=4.5

  # ---- Bioconductor 3.20 ----
  - bioconductor-singlecellexperiment
  - r-bixverse
  - bioconductor-zellkonverter

  # ---- CRAN ----
  - r-argparse
  - r-stringr
  - r-jsonlite

  # ---- Python side used by zellkonverter ----
  - python=3.12
  - anndata
  - h5py
  - scipy
  - pandas

