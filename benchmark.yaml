stages:
  - id: DATA
    outputs:
      - id: data_h5ad
        path: "{module.id}.h5ad"
      - id: data_clusters_truth
        path: "{module.id}.clusters_truth.tsv"
      - id: data_clusters_truth_num
        path: "{module.id}.clusters_truth_num.txt"
    modules:
      - id: datasets_r
        name: loads scRNA datasets
        software_environment: r_osta
        repository:
          url: https://github.com/omni-training/datasets
          commit: 068086f
        parameters:
          - dataset_name: ["sc-mix"]
          # - dataset_name: ["sc-mix", "be1", "cb", "1.3m"]
  - id: PIPELINE
    inputs:
      - data_h5ad
      - data_clusters_truth_num
    outputs:
      - id: methods_timings
        path: "{module.id}.timings.json"
      - id: methods_clustering_info
        path: "{module.id}.clustering_info.json"
      - id: methods_clusters
        path: "{module.id}.clusters.tsv"
      - id: methods_pca
        path: "{module.id}.pca.tsv"
      - id: methods_hvgs
        path: "{module.id}.hvgs.tsv"
    modules:
      - id: osta
        name: run R pipelines
        software_environment: r_osta
        repository:
          url: https://github.com/omni-training/pipelines-r
          commit: a93ac42
        parameters:
          - method_name: ["osca"]
            d_cluster: [0]
            filter: ["manual"]
            n_comp: [30]
            n_neig: [20]
            n_hvg: [1500]
      - id: scanpy
        name: run python pipelines
        software_environment: scanpy
        repository:
          url: https://github.com/omni-training/pipelines-py
          commit: b58e2c4
          entrypoint: scanpy
        parameters:
          - method_name: ["scanpy"]
            d_cluster: [0]
            filter: "manual"
            n_comp: [30]
            n_neig: [20]
            n_hvg: [1500]
      - id: brisc
        name: run python pipelines
        software_environment: brisc
        repository:
          url: https://github.com/omni-training/pipelines-py
          commit: b58e2c4
          entrypoint: brisc
        parameters:
          - d_cluster: [0]
            filter: "manual"
            n_comp: [30]
            n_neig: [20]
            n_hvg: [1500]
  - id: METRIC
    inputs:
      - data_clusters_truth
      - methods_pca
      - methods_clusters
      - methods_timings
      - methods_clustering_info
    outputs:
      - id: metrics_metrics
        path: "{module.id}.metrics.json"
    modules:
      - id: metrics_py
        name: compute clustering metrics
        software_environment: metrics
        repository:
          url: https://github.com/omni-training/metrics
          commit: 1560006
 
